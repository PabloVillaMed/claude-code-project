<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Prueba de motores</title>
  </head>
  <body>
    <script type="module">
      // Herramienta de desarrollo: renderiza (OfflineAudioContext) una
      // aceleración a fondo por todas las marchas, un rato a velocidad
      // constante, una desaceleración y un acelerón en neutro hasta el
      // limitador, con el modelo del motor del juego. ?perfil=moto4t&vmax=40
      // Deja el WAV (base64) en window.__wav y las rpm en window.__rpm.
      import { createEngineState, stepEngine } from '/src/sim/engineModel.js';
      import { EngineVoice, loadEngineBanks } from '/src/game/engineSound.js';

      const q = new URLSearchParams(location.search);
      const perfil = q.get('perfil') ?? 'moto4t';
      const vmax = +(q.get('vmax') ?? 40);
      const accel = +(q.get('accel') ?? 6);
      const secs = +(q.get('secs') ?? 22);
      const sr = 48000;
      const ctx = new OfflineAudioContext(2, sr * secs, sr);
      const banks = await loadEngineBanks(ctx);
      const voice = new EngineVoice(ctx, ctx.destination, banks, perfil);
      const e = createEngineState(perfil);
      let v = 0;
      const dt = 1 / 60;
      const rpmLog = [];
      for (let t = 0; t < secs; t += dt) {
        // 0-1 s ralentí; 1-12 s a fondo; 12-15 s crucero suave; 15-19 s sin
        // acelerador (frenando con motor); 19-22 s quieto y acelerón en neutro.
        let throttle = 0;
        if (t > 1 && t < 12) throttle = 1;
        else if (t >= 12 && t < 15) throttle = 0.3;
        else if (t >= 19.5 && t < 21) throttle = 1;
        if (t < 19) {
          if (throttle > 0) v = Math.min(vmax * 0.99, v + accel * throttle * (1 - v / vmax) * dt * (e.cut ? 0.4 : 1) - (throttle < 0.5 ? 0.6 * dt : 0));
          else v = Math.max(0, v - 4 * dt);
        } else v = 0;
        stepEngine(e, { speed: v, vmax, throttle, dt });
        const crackle = throttle === 0 && e.rpm > e.profile.redline * 0.45 && v > 4 ? 1 : 0;
        voice.set({ rpm: e.rpm, load: e.load, cut: e.limiting, crackle, gain: 0.9 }, 0.02, t);
        rpmLog.push([+t.toFixed(2), Math.round(e.rpm), e.gear, +e.load.toFixed(2), e.cut ? 1 : 0]);
      }
      const buf = await ctx.startRendering();
      // WAV de 16 bits.
      const ch = buf.getChannelData(0);
      const n = ch.length;
      const wav = new DataView(new ArrayBuffer(44 + n * 2));
      const w = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF');
      wav.setUint32(4, 36 + n * 2, true);
      w(8, 'WAVEfmt ');
      wav.setUint32(16, 16, true);
      wav.setUint16(20, 1, true);
      wav.setUint16(22, 1, true);
      wav.setUint32(24, sr, true);
      wav.setUint32(28, sr * 2, true);
      wav.setUint16(32, 2, true);
      wav.setUint16(34, 16, true);
      w(36, 'data');
      wav.setUint32(40, n * 2, true);
      let peak = 0;
      for (let i = 0; i < n; i++) {
        peak = Math.max(peak, Math.abs(ch[i]));
        wav.setInt16(44 + i * 2, Math.max(-1, Math.min(1, ch[i])) * 32767, true);
      }
      const bytes = new Uint8Array(wav.buffer);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      window.__wav = btoa(bin);
      window.__rpm = rpmLog;
      window.__peak = peak;
      window.__listo = true;
    </script>
  </body>
</html>
