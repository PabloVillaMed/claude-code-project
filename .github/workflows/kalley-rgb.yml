name: Kalley RGB

on:
  push:
    paths: ["kalley-rgb/**", ".github/workflows/kalley-rgb.yml"]
  pull_request:
    paths: ["kalley-rgb/**", ".github/workflows/kalley-rgb.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: kalley-rgb

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # xvfb da una pantalla virtual para que tambien corran las pruebas de la ventana.
      - run: xvfb-run -a python -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    needs: pruebas
    permissions:
      contents: write  # publicar el .exe en la release de prueba
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -t .
      # Comprueba que hidapi carga, enumera y lee descriptores en Windows real.
      - run: python -c "import hid; print(hid.version_str())"
      - run: python -m kalley_rgb diagnostico --todos
      - run: pyinstaller --onefile --windowed --name KalleyRGB --hidden-import hid KalleyRGB.pyw
      # Se publica como release y no como artefacto: las releases no consumen
      # la cuota de almacenamiento de Actions de la cuenta.
      - name: Publicar KalleyRGB.exe en la release de prueba
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: kalley-rgb-prueba
        run: |
          notes="Ejecutable de Windows generado desde la rama $GITHUB_REF_NAME, commit $GITHUB_SHA."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Kalley RGB (prueba)" --notes "$notes"
          fi
          gh release upload "$TAG" dist/KalleyRGB.exe --clobber
